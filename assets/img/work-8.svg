  </g>
  <g transform="translate(420 100)">
    <rect width="180" height="640" rx="24" fill="#c8ff3d"/>
    <rect x="20" y="240" width="140" height="200" fill="#0e0e0e"/>
    <text x="90" y="360" text-anchor="middle" font-family="Bricolage Grotesque, sans-serif" font-size="32" font-weight="600" fill="#c8ff3d">SOLIS</text>
