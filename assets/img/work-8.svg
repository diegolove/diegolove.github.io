<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Solis Beverages packaging">
  <rect width="1200" height="900" fill="#f5f4f0"/>
  <g transform="translate(180 100)">
    <rect width="180" height="640" rx="24" fill="#0e0e0e"/>
